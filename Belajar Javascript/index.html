<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Pixelify+Sans:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        *{
            margin: 0; padding: 0; font-family: "pixelify sans";
        }
    </style>
</head>
<body>
    <h1 id="Judul">Far Project</h1>
    <div class="container-content">
        <div class="content-list">
            <div class="container-content-list">
                <h1 class="content-judul">Counter</h1>
                <h2 id="count-el">0</h2>
                <button id="increment-btn" onclick="increment()" class="btn-btn">Tambah</button>
                <button id="decrement-btn" onclick="decrement()" class="btn-btn">Kurang</button>
                <button id="save-btn" onclick="save()" class="btn-btn">Save</button>
                <p id="save-el">Previous Entries: </p>
            </div>
            <div class="container-content-list">
                <h1 class="content-judul">Counter</h1>
                <h2 id="count-el">0</h2>
                <button id="purchase-btn" onclick="error()" class="btn-btn">Tambah</button>
                <p id="error-btn"></p>
            </div>
            <div class="container-content-list">
                <h1 class="content-judul">Counter</h1>
                <span class="angka-content" id="num1-el"></span>
                <span class="angka-content" id="num2-el"></span>
                <br>
                <button onclick="tambah()" class="btn-btn">Tambah</button>
                <br>
                <h4 id="sum-el">Hasil</h4>

            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
